[package]
name = "blinky"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.4.0", features = ["memory-x", "stm32f103c8", "time-driver-any"] }
embassy-time = { version = "0.5.0", features = ["tick-hz-1_000"] }
embedded-hal = "1.0.0"
panic-halt = "1.0.0"

[profile.release]
lto = true
opt-level = "s"
incremental = false
codegen-units = 1
debug = true